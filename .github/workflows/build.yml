name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Compile CV (fr)
        run: typst compile --font-path fonts/ --pdf-standard ua-1 cv.typ --input profile=fr cv.pdf

      - name: Release PDF on main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          files: cv.pdf
          make_latest: true
